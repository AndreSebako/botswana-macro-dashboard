name: Update News JSON

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build news JSON
        run: node scripts/build-news.mjs

      - name: Commit updated news
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/data/news.json
          git commit -m "Update cached news JSON" || echo "No changes to commit"
          git push